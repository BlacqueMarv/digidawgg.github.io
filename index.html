<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digi-Dawgg Labs LLC</title>
  <meta name="description" content="Digi-Dawgg Labs LLC — something's coming.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b8860b;
      --gold-light: #fef9e7;
      --gold-border: #e8d88a;
      --gold-dark: #7a6500;
      --text: #1a1a1a;
      --text-muted: #666;
      --text-faint: #999;
      --bg: #ffffff;
      --bg-subtle: #fafaf8;
      --border: rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
      height: 60px;
      display: flex;
      align-items: center;
      background: var(--bg);
    }

    .nav-logo {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 48px;
      text-align: center;
      background: var(--bg-subtle);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 400;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 20px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .sub {
      font-size: 16px;
      font-weight: 300;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.7;
      margin-bottom: 40px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .contact-card {
      background: var(--gold-light);
      border: 1px solid var(--gold-border);
      border-radius: 10px;
      padding: 20px 32px;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .contact-card p {
      font-size: 13px;
      font-weight: 400;
      color: var(--gold-dark);
      margin-bottom: 6px;
    }

    .contact-card a {
      font-size: 14px;
      font-weight: 500;
      color: var(--gold-dark);
      text-decoration: none;
    }

    .contact-card a:hover {
      text-decoration: underline;
    }

    footer {
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .footer-left {
      font-size: 12px;
      color: var(--text-faint);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      main { padding: 60px 24px; }
      footer { padding: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-logo">DIGI-DAWGG LABS</span>
  </nav>

  <main>
    <p class="eyebrow">Digi-Dawgg Labs LLC</p>
    <h1>Something's coming.</h1>
    <p class="sub">We're building something new. Check back soon.</p>
    <div class="contact-card">
      <p>Get in touch</p>
      <a href="mailto:digi.dawgg.labs@gmail.com">digi.dawgg.labs@gmail.com</a>
    </div>
  </main>

  <footer>
    <p class="footer-left">© 2026 Digi-Dawgg Labs LLC</p>
  </footer>

</body>
</html>
